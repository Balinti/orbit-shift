<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbit Shift - Free HTML5 Game</title>
<meta name="description" content="Play Orbit Shift - Tap to jump your star between galaxy rings as the color palette cycles and mismatched rings destroy you.">
<meta property="og:title" content="Orbit Shift - Free HTML5 Game">
<meta property="og:description" content="Thread the gap before the rings desync. Tap to fling your star through spinning ring gaps in this hyper-casual arcade game.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://balinti.github.io/orbit-shift/">
<meta name="theme-color" content="#0a0a1a">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4099346100621490" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:min(420px,100vw);height:min(750px,100vh)}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 420, H = 750, CX = W/2, CY = H/2;
const DPR = window.devicePixelRatio || 1;
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// Layout constants
const BASE_R = 112;   // visual radius of player's ring
const RING_GAP = 88;  // visual spacing between ring slots
const FLY_DUR = 0.42; // seconds for a fling

// State
let state = 'start';  // 'start' | 'playing' | 'gameover'
let score = 0;
let bestScore = parseInt(localStorage.getItem('orbitShift_v1_best') || '0');
let hue = 200;
let globalT = 0;

// Background stars
const STARS = Array.from({length: 72}, () => ({
  x: (Math.random() - 0.5) * W,
  y: (Math.random() - 0.5) * H,
  r: Math.random() * 1.3 + 0.3,
  phase: Math.random() * Math.PI * 2,
  speed: 0.6 + Math.random() * 1.4,
}));

// Rings array
let rings = [];
let playerRingIdx = 0;
let camRingIdx = 0;  // smooth float that lerps to playerRingIdx

// Player
const player = {
  angle: -Math.PI / 2,  // start at top
  flying: false,
  flyT: 0,
  flyFromAngle: 0,
  flyAngVel: 0,   // angular velocity carried during flight
};

// Visual effects
let particles = [];
let popups = [];   // score popup texts
let shakeMag = 0, shakeX = 0, shakeY = 0;

// ─── Ring helpers ────────────────────────────────────────────
function ringRadius(idx) {
  return BASE_R + (idx - camRingIdx) * RING_GAP;
}

function makeRing() {
  const difficulty = Math.max(0, rings.length - 2);
  const gapHalf = Math.max(0.155, 0.32 - difficulty * 0.0045);
  const speedBase = 0.72 + difficulty * 0.045;
  const speedVar  = 0.45 + Math.random() * 0.85;
  const dir = Math.random() < 0.5 ? 1 : -1;
  return {
    gapAngle: Math.random() * Math.PI * 2,
    gapHalf,
    rotSpeed: (speedBase + speedVar) * dir,
    hue: Math.random() * 360,
  };
}

function initGame() {
  score = 0;
  hue = Math.random() * 360;
  particles = [];
  popups = [];
  shakeMag = 0;
  rings = [];
  playerRingIdx = 0;
  camRingIdx = 0;
  player.angle = -Math.PI / 2;
  player.flying = false;
  player.flyT = 0;
  for (let i = 0; i < 5; i++) rings.push(makeRing());
  // First gap near player start so first tap teaches mechanics
  rings[1].gapAngle = player.angle + (Math.random() - 0.5) * 0.9;
}

// ─── Input ───────────────────────────────────────────────────
function handleTap() {
  if (state === 'start') {
    state = 'playing';
    initGame();
    return;
  }
  if (state === 'gameover') {
    state = 'playing';
    initGame();
    return;
  }
  if (state === 'playing' && !player.flying) {
    const cur = rings[playerRingIdx];
    player.flyFromAngle = player.angle;
    player.flyAngVel = cur.rotSpeed;  // carry orbital momentum
    player.flying = true;
    player.flyT = 0;
  }
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); handleTap(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleTap(); }
});

// ─── Utilities ───────────────────────────────────────────────
function angDiff(a, b) {
  let d = ((a - b) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  return d;
}

function eio(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t; }

function spawnParticles(wx, wy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 75 + Math.random() * 210;
    const life = 0.35 + Math.random() * 0.45;
    particles.push({ x: wx, y: wy, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
                     color, r: 1.8 + Math.random() * 3, life, maxLife: life });
  }
}

function addPopup(text, wx, wy, color) {
  popups.push({ text, x: wx, y: wy, life: 1.0, color });
}

// ─── Update ──────────────────────────────────────────────────
function update(dt) {
  if (state !== 'playing') return;

  hue = (hue + 11 * dt) % 360;
  camRingIdx += (playerRingIdx - camRingIdx) * 7 * dt;

  for (const r of rings) r.gapAngle += r.rotSpeed * dt;

  if (!player.flying) {
    player.angle += rings[playerRingIdx].rotSpeed * dt;
  } else {
    player.flyT += dt / FLY_DUR;
    // Continuous angle update during flight
    player.angle = player.flyFromAngle + player.flyAngVel * (player.flyT * FLY_DUR);

    if (player.flyT >= 1) {
      // Arrival
      const arrAngle = player.flyFromAngle + player.flyAngVel * FLY_DUR;
      const nextRing = rings[playerRingIdx + 1];
      const diff = angDiff(arrAngle, nextRing.gapAngle);

      if (Math.abs(diff) < nextRing.gapHalf) {
        // SUCCESS
        const nearMiss = Math.abs(diff) > nextRing.gapHalf * 0.70;
        score++;
        if (nearMiss) score++;

        playerRingIdx++;
        player.angle = arrAngle;
        player.flying = false;
        player.flyT = 0;
        rings.push(makeRing());

        const ar = ringRadius(playerRingIdx);
        const wx = Math.cos(arrAngle) * ar;
        const wy = Math.sin(arrAngle) * ar;
        spawnParticles(wx, wy, nearMiss ? '#FFD700' : `hsl(${nextRing.hue},100%,72%)`, nearMiss ? 24 : 14);
        if (nearMiss) addPopup('NEAR MISS! +2', wx, wy - 20, '#FFD700');

      } else {
        // FAIL
        const ar = ringRadius(playerRingIdx + 1);
        const wx = Math.cos(arrAngle) * ar;
        const wy = Math.sin(arrAngle) * ar;
        spawnParticles(wx, wy, '#FF3344', 36);
        shakeMag = 16;
        state = 'gameover';
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('orbitShift_v1_best', bestScore);
        }
      }
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // Popups
  for (const pop of popups) { pop.y -= 40 * dt; pop.life -= dt * 1.6; }
  popups = popups.filter(p => p.life > 0);

  // Shake
  if (shakeMag > 0.5) {
    shakeMag *= 0.80;
    shakeX = (Math.random() - 0.5) * shakeMag;
    shakeY = (Math.random() - 0.5) * shakeMag;
  } else { shakeMag = shakeX = shakeY = 0; }
}

// ─── Draw ────────────────────────────────────────────────────
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05050f');
  g.addColorStop(1, '#0d0525');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  ctx.save();
  ctx.translate(CX, CY);
  for (const s of STARS) {
    const b = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(globalT * s.speed + s.phase));
    ctx.globalAlpha = b;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawRings() {
  const start = Math.max(0, playerRingIdx - 1);
  const end   = Math.min(rings.length, playerRingIdx + 4);
  for (let i = start; i < end; i++) {
    const ring = rings[i];
    const r = ringRadius(i);
    if (r < 8) continue;

    const offset = i - camRingIdx;
    let alpha = 1;
    if (offset < -0.05) alpha = Math.max(0, 1 + offset * 4);
    else if (offset > 2.6) alpha = Math.max(0, 1 - (offset - 2.6) * 3);
    if (alpha <= 0.02) continue;

    const isCurrent = (i === playerRingIdx);
    const isNext    = (i === playerRingIdx + 1);
    const rHue = (ring.hue + hue * 0.35) % 360;
    const light = isCurrent ? 68 : isNext ? 62 : 46;
    const sat   = isCurrent ? 80 : isNext ? 76 : 55;
    const baseA = alpha * (isCurrent ? 1 : isNext ? 0.88 : 0.32);
    const lw    = isCurrent ? 3.2 : isNext ? 2.6 : 1.6;

    ctx.shadowColor = `hsl(${rHue},80%,65%)`;
    ctx.shadowBlur  = isCurrent ? 8 : isNext ? 6 : 3;

    // Ring body (gap cut out)
    ctx.beginPath();
    ctx.arc(0, 0, r,
      ring.gapAngle + ring.gapHalf,
      ring.gapAngle - ring.gapHalf + Math.PI * 2
    );
    ctx.strokeStyle = `hsla(${rHue},${sat}%,${light}%,${baseA})`;
    ctx.lineWidth = lw;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Highlight gap on next ring
    if (isNext) {
      ctx.beginPath();
      ctx.arc(0, 0, r, ring.gapAngle - ring.gapHalf, ring.gapAngle + ring.gapHalf);
      ctx.strokeStyle = `hsla(${rHue},100%,82%,${alpha * 0.42})`;
      ctx.lineWidth = 5;
      ctx.stroke();

      for (const sign of [-1, 1]) {
        const ea = ring.gapAngle + sign * ring.gapHalf;
        ctx.shadowColor = `hsl(${rHue},100%,80%)`;
        ctx.shadowBlur  = 6;
        ctx.fillStyle   = `hsla(${rHue},100%,88%,${alpha * 0.92})`;
        ctx.beginPath();
        ctx.arc(Math.cos(ea) * r, Math.sin(ea) * r, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }
}

function drawPlayer() {
  let r, angle;
  if (!player.flying) {
    r = ringRadius(playerRingIdx);
    angle = player.angle;
  } else {
    const t = eio(player.flyT);
    const fromR = ringRadius(playerRingIdx);
    const toR   = ringRadius(playerRingIdx + 1);
    r = fromR + (toR - fromR) * t;
    angle = player.flyFromAngle + player.flyAngVel * (player.flyT * FLY_DUR);
  }

  const px = Math.cos(angle) * r;
  const py = Math.sin(angle) * r;

  // Flight trail
  if (player.flying) {
    const steps = 12;
    for (let i = steps - 1; i >= 1; i--) {
      const ft = player.flyT * (i / steps);
      const tt = eio(ft);
      const fromR = ringRadius(playerRingIdx);
      const toR   = ringRadius(playerRingIdx + 1);
      const tr = fromR + (toR - fromR) * tt;
      const ta = player.flyFromAngle + player.flyAngVel * (ft * FLY_DUR);
      ctx.globalAlpha = (i / steps) * 0.4;
      ctx.fillStyle = `hsl(${hue},100%,80%)`;
      ctx.beginPath();
      ctx.arc(Math.cos(ta) * tr, Math.sin(ta) * tr, 3.5 * (i / steps), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Outer glow
  ctx.shadowColor = `hsl(${hue},100%,80%)`;
  ctx.shadowBlur  = 18;
  const grd = ctx.createRadialGradient(px, py, 0, px, py, 17);
  grd.addColorStop(0, `hsla(${hue},100%,95%,0.85)`);
  grd.addColorStop(1, `hsla(${hue},100%,70%,0)`);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(px, py, 17, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Core dot
  ctx.fillStyle = `hsl(${hue},50%,98%)`;
  ctx.beginPath();
  ctx.arc(px, py, 5.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const pop of popups) {
    ctx.globalAlpha = Math.max(0, pop.life);
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = pop.color;
    ctx.fillText(pop.text, pop.x, pop.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  ctx.font         = 'bold 34px Arial';
  ctx.fillStyle    = 'rgba(255,255,255,0.92)';
  ctx.fillText(score, CX, 24);
  ctx.font      = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.fillText('BEST ' + bestScore, CX, 63);
  ctx.textBaseline = 'alphabetic';
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(4,4,20,0.80)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  const ty = CY - 95;
  ctx.font        = 'bold 60px Arial';
  ctx.shadowColor = `hsl(${hue},100%,70%)`;
  ctx.shadowBlur  = 18;
  ctx.fillStyle   = `hsl(${hue},88%,72%)`;
  ctx.fillText('ORBIT', CX, ty);
  ctx.fillStyle   = `hsl(${(hue + 45) % 360},88%,78%)`;
  ctx.fillText('SHIFT', CX, ty + 68);
  ctx.shadowBlur  = 0;

  ctx.font      = '15px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.52)';
  ctx.fillText('Thread the gap before the rings desync', CX, ty + 122);

  const pulse = 0.55 + 0.45 * Math.sin(globalT * 2.8);
  ctx.font      = 'bold 20px Arial';
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('TAP TO START', CX, ty + 178);

  ctx.font      = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText('Tap  \u00b7  Space  \u00b7  Enter', CX, ty + 214);

  ctx.textBaseline = 'alphabetic';
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(4,4,20,0.84)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font        = 'bold 30px Arial';
  ctx.fillStyle   = '#FF4455';
  ctx.shadowColor = '#FF0022';
  ctx.shadowBlur  = 12;
  ctx.fillText('SHATTERED', CX, CY - 72);
  ctx.shadowBlur  = 0;

  ctx.font      = 'bold 82px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(score, CX, CY + 10);

  if (score > 0 && score === bestScore) {
    ctx.font        = 'bold 17px Arial';
    ctx.fillStyle   = '#FFD700';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur  = 8;
    ctx.fillText('NEW BEST!', CX, CY + 58);
    ctx.shadowBlur  = 0;
  } else {
    ctx.font      = '14px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.fillText('BEST: ' + bestScore, CX, CY + 58);
  }

  const pulse = 0.55 + 0.45 * Math.sin(globalT * 2.8);
  ctx.font      = 'bold 19px Arial';
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('TAP TO RETRY', CX, CY + 108);

  ctx.textBaseline = 'alphabetic';
}

function draw() {
  drawBg();
  drawStars();

  ctx.save();
  ctx.translate(CX + shakeX, CY + shakeY);

  drawRings();

  if (state === 'playing') {
    drawPlayer();
    drawParticles();
    drawPopups();
  } else if (state === 'gameover') {
    drawParticles();
  }

  ctx.restore();

  if (state === 'playing' || state === 'gameover') drawHUD();
  if (state === 'start')    drawStartScreen();
  if (state === 'gameover') drawGameOverScreen();
}

// ─── Main loop ───────────────────────────────────────────────
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  globalT += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Boot
initGame();
requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
