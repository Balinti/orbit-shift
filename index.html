<body>
<div id="gameRoot">
  <canvas id="c"></canvas>
</div>
<section id="about">
  <h2>How to Play — Orbit Shift</h2>
  <p>Your ship orbits a planet on one of two rings. <strong>Tap / Space / Enter</strong> to change polarity or switch lanes via a Slingshot Window. Match the gate's color &amp; symbol to score points. One shield saves your first mistake. Survive as long as possible!</p>
</section>

<script>
'use strict';
// ─── Constants ─────────────────────────────────────────────────────────────
const LS_KEY    = 'orbitshift_highscore';
const DPR       = Math.min(window.devicePixelRatio || 1, 2);
const TAU       = Math.PI * 2;
const POLARITIES = [
  { hue: 30,  label: '●', name: 'dot'      },  // orange
  { hue: 200, label: '▲', name: 'triangle' },  // cyan
  { hue: 310, label: '◆', name: 'diamond'  },  // magenta
];

// ─── Canvas / layout ───────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy, innerR, outerR;

function resize() {
  const root = document.getElementById('gameRoot');
  const rect  = root.getBoundingClientRect();
  W = rect.width;  H = rect.height;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2;
  cy = H / 2 + H * 0.04;
  const r = Math.min(W, H) / 2;
  innerR = r * 0.42;
  outerR = r * 0.70;
}
window.addEventListener('resize', resize);
resize();

// ─── Math helpers ──────────────────────────────────────────────────────────
function angDiff(a, b) {
  let d = ((b - a) % TAU + TAU) % TAU;
  if (d > Math.PI) d -= TAU;
  return d;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rand(lo, hi)  { return lo + Math.random() * (hi - lo); }
function randInt(lo, hi) { return Math.floor(rand(lo, hi + 1)); }
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }

// ─── State ─────────────────────────────────────────────────────────────────
let state, shake, particles, gates;

function initState() {
  state = {
    phase:      'start',   // 'start' | 'playing' | 'gameover'
    score:      0,
    best:       parseInt(localStorage.getItem(LS_KEY)) || 0,
    t:          0,
    streak:     0,
    shield:     true,
    shieldBreak: false,
    unlocked3rd: false,
    player: {
      ring:    'inner',
      angle:   -Math.PI / 2,
      dir:     1,          // +1 CW, -1 CCW
      polIdx:  0,
      speed:   1.3,
    },
    sling: {
      ang:  Math.PI / 2,  // opposite side from player start
      half: 0.55,
      drift: 0,
    },
    diff: {
      gateInterval: 2.8,
      nextGate:     2.2,
      speed:        1.3,
    },
  };
  shake     = { x: 0, y: 0, mag: 0 };
  particles = [];
  gates     = [];
}

function numPol() { return state.unlocked3rd ? 3 : 2; }
function mulOf(streak) {
  if (streak < 3)  return 1;
  if (streak < 6)  return 1.5;
  if (streak < 10) return 2;
  return 3;
}

// ─── Input ─────────────────────────────────────────────────────────────────
function onTap() {
  if (state.phase === 'start')    { startGame(); return; }
  if (state.phase === 'gameover') { initState(); return; }
  if (state.phase === 'playing')  { handleTap(); }
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(); }
  if (e.code === 'KeyS' && state && state.phase === 'gameover') doShare();
});

function startGame() {
  initState();
  state.phase = 'playing';
}

function handleTap() {
  const p = state.player;
  const s = state.sling;
  const inWindow = Math.abs(angDiff(p.angle, s.ang)) < s.half;

  if (inWindow) {
    p.ring   = (p.ring === 'inner') ? 'outer' : 'inner';
    p.polIdx = (p.polIdx + 1) % numPol();
    spawnParticlesBurst(playerX(), playerY(), POLARITIES[p.polIdx].hue, 14, 80, 180);
  } else {
    p.polIdx = (p.polIdx + 1) % numPol();
  }
}

function playerX() {
  const p = state.player;
  return cx + Math.cos(p.angle) * ((p.ring === 'inner') ? innerR : outerR);
}
function playerY() {
  const p = state.player;
  return cy + Math.sin(p.angle) * ((p.ring === 'inner') ? innerR : outerR);
}

// ─── Particles ─────────────────────────────────────────────────────────────
function spawnParticlesBurst(x, y, hue, n, spdLo, spdHi) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, TAU);
    const spd = rand(spdLo, spdHi);
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1, maxLife: rand(0.4, 1.0),
      r: rand(2, 5.5),
      hue, sat: 90, lit: 68,
    });
  }
}

// ─── Gate spawn ────────────────────────────────────────────────────────────
function spawnGate() {
  const p   = state.player;
  const t   = state.t;
  const cnt = (t > 25 && Math.random() < 0.4) ? 2 : 1;

  for (let i = 0; i < cnt; i++) {
    const ring   = (i === 0) ? p.ring : ((p.ring === 'inner') ? 'outer' : 'inner');
    const feint  = (t > 45) && Math.random() < 0.35;
    const polIdx = randInt(0, numPol() - 1);
    const ahead  = p.dir * rand(2.2, 3.1);
    const ang    = ((p.angle + ahead) % TAU + TAU) % TAU;

    gates.push({
      ring, angle: ang,
      speed:   state.diff.speed * ((ring === 'inner') ? 1.0 : 0.82),
      dir:     p.dir,
      polIdx, feint,
      half:    0.17,
      passed:  false,
      cleared: false,
      flash:   0,
    });
  }
}

// ─── Update ────────────────────────────────────────────────────────────────
let lastTime = 0;

function update(ts) {
  const rawDt = (ts - lastTime) / 1000;
  lastTime = ts;
  const dt = clamp(rawDt, 0, 0.1);

  if (state.phase !== 'playing') return;

  state.t += dt;
  const t = state.t;

  // Unlock 3rd polarity
  if (!state.unlocked3rd && (state.score >= 8 || t >= 12)) state.unlocked3rd = true;

  // Difficulty ramp
  const ramp = Math.min(t / 90, 1);
  state.diff.speed        = 1.3 + ramp * 1.6;
  state.diff.gateInterval = Math.max(1.2, 2.8 - t * 0.018);
  state.diff.nextGate    -= dt;
  if (state.diff.nextGate <= 0) {
    spawnGate();
    state.diff.nextGate = state.diff.gateInterval * rand(0.8, 1.3);
  }

  // Player move
  const p = state.player;
  p.speed = state.diff.speed;
  p.angle += p.dir * p.speed * dt;

  // Slingshot window
  const s  = state.sling;
  s.half   = clamp(0.55 - t * 0.003, 0.22, 0.55);
  if (t > 45) {
    s.drift = Math.sin(t * 0.4) * 0.5;
    s.ang  += s.drift * dt;
  } else {
    s.ang   = p.angle + Math.PI; // opposite side
  }

  // Gates
  for (let i = gates.length - 1; i >= 0; i--) {
    const g = gates[i];
    g.angle += g.dir * g.speed * dt;
    g.flash  = Math.max(0, g.flash - dt * 3.5);

    if (g.cleared || g.passed) continue;

    const sameRing = (g.ring === p.ring);
    const overlap  = sameRing && Math.abs(angDiff(p.angle, g.angle)) < (g.half + 0.13);

    if (overlap) {
      if (g.polIdx === p.polIdx || g.feint) {
        // Cleared
        g.cleared = true;
        if (!g.feint) {
          const mul = mulOf(state.streak);
          state.score += Math.max(1, Math.round(mul));
          state.streak++;
          if (state.score > state.best) {
            state.best = state.score;
            localStorage.setItem(LS_KEY, state.best);
          }
        }
        const r2 = (g.ring === 'inner') ? innerR : outerR;
        const gx = cx + Math.cos(g.angle) * r2;
        const gy = cy + Math.sin(g.angle) * r2;
        spawnParticlesBurst(gx, gy, POLARITIES[g.polIdx].hue, state.streak >= 3 ? 20 : 10, 80, 200);
        g.flash = 0.35;
      } else if (!g.feint) {
        hitPlayer(g);
        g.passed = true;
      }
    }

    // Gate far behind — discard
    if (angDiff(p.angle, g.angle) * p.dir < -Math.PI * 1.1) g.passed = true;
  }

  // GC
  gates     = gates.filter(g => (!g.passed && !g.cleared) || g.flash > 0);
  if (gates.length > 30) gates.splice(0, gates.length - 30);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x    += pt.vx * dt;
    pt.y    += pt.vy * dt;
    pt.vx   *= Math.pow(0.90, dt * 60);
    pt.vy   *= Math.pow(0.90, dt * 60);
    pt.life -= dt / pt.maxLife;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  if (particles.length > 200) particles.splice(0, particles.length - 200);

  // Shake decay
  shake.mag *= Math.pow(0.05, dt);
  shake.x = (Math.random() - 0.5) * shake.mag;
  shake.y = (Math.random() - 0.5) * shake.mag;
}

function hitPlayer() {
  if (state.shield) {
    state.shield     = false;
    state.shieldBreak = true;
    state.streak      = 0;
    shake.mag = 18;
    spawnParticlesBurst(playerX(), playerY(), 55, 20, 80, 230);
    setTimeout(() => { if (state) state.shieldBreak = false; }, 600);
  } else {
    // Death
    spawnParticlesBurst(playerX(), playerY(), rand(0, 360), 30, 100, 320);
    shake.mag = 42;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem(LS_KEY, state.best);
    }
    state.phase = 'gameover';
  }
}

// ─── Draw ──────────────────────────────────────────────────────────────────
// Persistent stars
const STARS = Array.from({length: 65}, () => ({
  x: Math.random(), y: Math.random(),
  r: rand(0.3, 1.6),
  bri: rand(0.2, 0.8),
  ph: rand(0, TAU),
}));

function draw(ts) {
  const sec = ts / 1000;
  ctx.save();
  ctx.translate(shake.x, shake.y);

  // Background
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#12122a');
  bg.addColorStop(1, '#05050f');
  ctx.fillStyle = bg;
  ctx.fillRect(-shake.x - 2, -shake.y - 2, W + 4, H + 4);

  // Stars
  for (const s of STARS) {
    const lum = s.bri * (0.7 + 0.3 * Math.sin(sec * 0.9 + s.ph));
    ctx.fillStyle = `rgba(255,255,255,${lum})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
    ctx.fill();
  }

  // Orbit rings
  drawOrbit(innerR);
  drawOrbit(outerR);

  // Slingshot window
  if (state.phase === 'playing') drawSlingshotWindow();

  // Planet
  drawPlanet();

  // Gates
  for (const g of gates) drawGate(g);

  // Particles
  for (const pt of particles) {
    const a = Math.max(0, pt.life);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r * a, 0, TAU);
    ctx.fillStyle = hsl(pt.hue, pt.sat, pt.lit, a * 0.9);
    ctx.fill();
  }

  // Player
  if (state.phase !== 'start') drawPlayer(sec);

  // HUD
  if (state.phase === 'playing') drawHUD();

  // Overlays
  if (state.phase === 'start')    drawStart();
  if (state.phase === 'gameover') drawGameover();

  ctx.restore();
}

function drawOrbit(r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth   = 1.5;
  ctx.stroke();
}

function drawSlingshotWindow() {
  const s = state.sling;
  for (const [ring, r] of [['inner', innerR], ['outer', outerR]]) {
    const playerRing = state.player.ring === ring;
    const alp = playerRing ? 0.22 : 0.09;
    const lw  = playerRing ? 10 : 5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, s.ang - s.half, s.ang + s.half);
    ctx.strokeStyle = `rgba(255,225,90,${alp})`;
    ctx.lineWidth   = lw;
    ctx.stroke();
    // Edge markers
    for (const side of [-1, 1]) {
      const ea = s.ang + side * s.half;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ea) * (r - 7), cy + Math.sin(ea) * (r - 7));
      ctx.lineTo(cx + Math.cos(ea) * (r + 7), cy + Math.sin(ea) * (r + 7));
      ctx.strokeStyle = `rgba(255,225,90,${alp * 2.5})`;
      ctx.lineWidth   = 2;
      ctx.stroke();
    }
  }
}

function drawPlanet() {
  const g1 = ctx.createRadialGradient(cx - 7, cy - 7, 2, cx, cy, 24);
  g1.addColorStop(0, '#8cf');
  g1.addColorStop(0.5, '#37d');
  g1.addColorStop(1, '#113');
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, TAU);
  ctx.fillStyle = g1;
  ctx.fill();
  // Glow halo
  const g2 = ctx.createRadialGradient(cx, cy, 20, cx, cy, 52);
  g2.addColorStop(0, 'rgba(100,160,255,0.13)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 52, 0, TAU);
  ctx.fillStyle = g2;
  ctx.fill();
}

function drawGate(g) {
  const r   = (g.ring === 'inner') ? innerR : outerR;
  const pol = POLARITIES[g.polIdx];
  const alp = g.feint ? 0.32 : 1.0;
  const lw  = g.feint ? 4 : 7;

  ctx.beginPath();
  ctx.arc(cx, cy, r, g.angle - g.half, g.angle + g.half);
  ctx.strokeStyle = hsl(pol.hue, 88, 60, alp);
  ctx.lineWidth   = lw;
  if (g.flash > 0) {
    ctx.shadowBlur  = 22 * (g.flash / 0.35);
    ctx.shadowColor = hsl(pol.hue, 100, 72);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Symbol
  const mx = cx + Math.cos(g.angle) * r;
  const my = cy + Math.sin(g.angle) * r;
  ctx.save();
  ctx.translate(mx, my);
  ctx.font         = `bold ${g.feint ? 10 : 12}px sans-serif`;
  ctx.fillStyle    = hsl(pol.hue, 85, 82, alp);
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pol.label, 0, 0);
  ctx.restore();
}

function drawPlayer(sec) {
  const p   = state.player;
  const r   = (p.ring === 'inner') ? innerR : outerR;
  const px  = cx + Math.cos(p.angle) * r;
  const py  = cy + Math.sin(p.angle) * r;
  const pol = POLARITIES[p.polIdx];

  // Glow
  const gl = ctx.createRadialGradient(px, py, 0, px, py, 24);
  gl.addColorStop(0, hsl(pol.hue, 100, 72, 0.5));
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(px, py, 24, 0, TAU);
  ctx.fillStyle = gl;
  ctx.fill();

  // Triangle ship pointing in travel direction
  const heading = p.angle + Math.PI / 2 * (p.dir > 0 ? 1 : -1);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(heading);
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(7,  8);
  ctx.lineTo(-7, 8);
  ctx.closePath();
  ctx.fillStyle   = hsl(pol.hue, 90, 68);
  ctx.strokeStyle = hsl(pol.hue, 50, 90);
  ctx.lineWidth   = 1.5;
  ctx.fill();
  ctx.stroke();
  // Polarity label inside
  ctx.font         = 'bold 8px sans-serif';
  ctx.fillStyle    = '#fff';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pol.label, 0, 1);
  ctx.restore();

  // Shield ring
  if (state.shield) {
    const pulse = 0.5 + 0.5 * Math.sin(sec * 5.5);
    ctx.beginPath();
    ctx.arc(px, py, 15, 0, TAU);
    ctx.strokeStyle = `rgba(255,225,70,${0.55 + 0.3 * pulse})`;
    ctx.lineWidth   = 2;
    ctx.stroke();
  }
  if (state.shieldBreak) {
    ctx.beginPath();
    ctx.arc(px, py, 17, 0, TAU);
    ctx.strokeStyle = 'rgba(255,60,60,0.85)';
    ctx.lineWidth   = 3;
    ctx.stroke();
  }
}

function drawHUD() {
  const mul = mulOf(state.streak);
  ctx.textBaseline = 'top';

  // Score
  ctx.font      = 'bold 30px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(state.score, cx, 14);

  // Multiplier
  if (mul > 1) {
    ctx.font      = 'bold 13px sans-serif';
    ctx.fillStyle = hsl(55, 100, 65);
    ctx.fillText(`×${mul}`, cx, 50);
  }

  // Shield indicator
  ctx.font      = '12px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = state.shield ? 'rgba(255,215,55,0.9)' : 'rgba(255,255,255,0.18)';
  ctx.fillText('⚡ Shield', W - 10, 14);

  // Streak
  if (state.streak >= 2) {
    ctx.font      = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`Streak ${state.streak}`, 10, 14);
  }
}

function drawOverlayBg() {
  ctx.fillStyle = 'rgba(4,4,18,0.62)';
  ctx.fillRect(0, 0, W, H);
}

function drawStart() {
  drawOverlayBg();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font      = 'bold 40px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Orbit Shift', cx, cy - 85);

  ctx.font      = '15px sans-serif';
  ctx.fillStyle = 'rgba(170,195,255,0.85)';
  ctx.fillText('Match gates. Switch lanes.', cx, cy - 42);

  // Polarity preview
  for (let i = 0; i < 3; i++) {
    const pol = POLARITIES[i];
    ctx.font      = 'bold 18px sans-serif';
    ctx.fillStyle = hsl(pol.hue, 88, 65);
    ctx.fillText(pol.label, cx - 50 + i * 50, cy + 12);
  }
  ctx.font      = '11px sans-serif';
  ctx.fillStyle = 'rgba(200,200,255,0.45)';
  ctx.fillText('3 polarities to match', cx, cy + 38);

  // Prompt
  const pulse = 0.55 + 0.45 * Math.sin(Date.now() / 420);
  ctx.font      = 'bold 17px sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('Tap  /  Space  to Start', cx, cy + 85);

  if (state.best > 0) {
    ctx.font      = '13px sans-serif';
    ctx.fillStyle = 'rgba(255,195,70,0.75)';
    ctx.fillText(`Best: ${state.best}`, cx, cy + 118);
  }
}

function drawGameover() {
  drawOverlayBg();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font      = 'bold 34px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Game Over', cx, cy - 75);

  ctx.font      = 'bold 24px sans-serif';
  ctx.fillStyle = hsl(55, 100, 68);
  ctx.fillText(`Score: ${state.score}`, cx, cy - 28);

  ctx.font      = '16px sans-serif';
  ctx.fillStyle = 'rgba(255,195,90,0.75)';
  ctx.fillText(`Best: ${state.best}`, cx, cy + 10);

  const pulse = 0.55 + 0.45 * Math.sin(Date.now() / 420);
  ctx.font      = 'bold 17px sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('Tap  /  Space  to Retry', cx, cy + 58);

  ctx.font      = '12px sans-serif';
  ctx.fillStyle = 'rgba(140,190,255,0.55)';
  ctx.fillText('[ S ] — Challenge a friend', cx, cy + 90);
}

// ─── Share ─────────────────────────────────────────────────────────────────
function doShare() {
  const url  = `https://balinti.github.io/orbit-shift/?ref=share&score=${state.score}`;
  const text = `I scored ${state.score} in Orbit Shift! Can you beat me?`;
  if (navigator.share) {
    navigator.share({ title: 'Orbit Shift', text, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(`${text} ${url}`).then(() => {
      alert('Copied to clipboard!');
    }).catch(() => {
      prompt('Copy this link:', url);
    });
  }
}

// ─── Main loop ─────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw(ts);
  requestAnimationFrame(loop);
}

initState();
requestAnimationFrame(ts => { lastTime = ts; loop(ts); });
</script>
