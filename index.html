<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orbit Shift - Free HTML5 Game</title>
  <meta name="description" content="Play Orbit Shift - Tap to switch gravity and navigate the zigzag galaxy path without crashing into asteroids.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <link rel="canonical" href="https://balinti.github.io/orbit-shift/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orbit Shift - Free HTML5 Game">
  <meta property="og:description" content="Play Orbit Shift - Tap to switch gravity and navigate the zigzag galaxy path without crashing into asteroids.">
  <meta property="og:url" content="https://balinti.github.io/orbit-shift/">
  <meta property="og:image" content="https://balinti.github.io/orbit-shift/og-image.png">

  <!-- AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4099346100621490" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #ccc;
    }
    #app {
      position: relative;
      width: min(420px, 100vw);
      height: min(750px, 100vh);
      flex-shrink: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      cursor: pointer;
    }
    #seo-text {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <p id="seo-text">Orbit Shift is a free browser HTML5 hyper-casual game. Tap to flip between inner and outer orbit rings, dodge gates, and set a high score. Play instantly — no download needed.</p>
</div>
<script>
'use strict';
// ─── constants ───────────────────────────────────────────────────────────────
const LS_KEY = 'orbitshift_highscore_v1';
const TWO_PI = Math.PI * 2;
const INNER = 0, OUTER = 1;

// ─── canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  const rect = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── helpers ─────────────────────────────────────────────────────────────────
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const angleDiff = (a, b) => { let d = ((b - a) % TWO_PI + TWO_PI) % TWO_PI; return d > Math.PI ? d - TWO_PI : d; };
const hsl = (h, s, l, a = 1) => `hsla(${h|0},${s|0}%,${l|0}%,${a})`;
const rng = (lo, hi) => lo + Math.random() * (hi - lo);

// ─── URL challenge params ─────────────────────────────────────────────────────
const urlParams = new URLSearchParams(location.search);
const challengeScore = parseInt(urlParams.get('challengeScore')) || 0;
const challengeSeed = urlParams.get('seed') || '';

// ─── state ────────────────────────────────────────────────────────────────────
let state = 'start'; // start | playing | gameover
let highScore = parseInt(localStorage.getItem(LS_KEY)) || 0;

// game world
let player, gates, particles, score, bestScore;
let innerTime, perfectStreak, totalPerfect;
let timeScale, slowMoTimer;
let trauma, bgHue, bgHueSpeed;
let diffTimer, gateInterval, gateSpeed;
let gameTime;

// share button bounding box
let shareBtn = null;

function initGame() {
  player = {
    ring: OUTER,
    angle: -Math.PI / 2,   // top of circle
    angularVelocity: 1.4,  // rad/s
    dir: 1,
    r: 0,                  // current display radius (lerps)
    targetR: 0,
    thrusterTimer: 0,
  };
  gates = [];
  particles = [];
  score = 0;
  bestScore = highScore;
  innerTime = 0;
  perfectStreak = 0;
  totalPerfect = 0;
  timeScale = 1;
  slowMoTimer = 0;
  trauma = 0;
  bgHue = 220;
  bgHueSpeed = 4; // deg/s
  diffTimer = 0;
  gateInterval = 3.5;
  gateSpeed = 0.9;
  gameTime = 0;
  shareBtn = null;

  const radii = ringRadii();
  player.r = radii[OUTER];
  player.targetR = radii[OUTER];
}

function ringRadii() {
  const minDim = Math.min(W, H);
  return [minDim * 0.26, minDim * 0.43];
}

// ─── particles ───────────────────────────────────────────────────────────────
function spawnParticles(x, y, count, hue, speed, size, life) {
  for (let i = 0; i < count; i++) {
    const ang = rng(0, TWO_PI);
    const spd = rng(speed * 0.4, speed);
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life, maxLife: life,
      hue: hue + rng(-20, 20),
      size: rng(size * 0.5, size),
      alpha: 1,
    });
  }
}

function spawnThruster(x, y, ring) {
  const hue = ring === INNER ? 300 : 180; // magenta / cyan
  const ang = rng(0, TWO_PI);
  const spd = rng(20, 60);
  particles.push({
    x, y,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    life: rng(0.15, 0.35), maxLife: 0.35,
    hue, size: rng(2, 4), alpha: 1,
    thruster: true,
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
    p.alpha = clamp(p.life / p.maxLife, 0, 1);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha * (p.thruster ? 0.7 : 1);
    ctx.fillStyle = hsl(p.hue, 100, 65);
    ctx.shadowBlur = p.thruster ? 4 : 8;
    ctx.shadowColor = hsl(p.hue, 100, 70);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  }
}

// ─── gates ───────────────────────────────────────────────────────────────────
function spawnGate() {
  const radii = ringRadii();
  // Pick ring(s); occasionally span both
  const bothRings = Math.random() < 0.18 && gameTime > 12;
  const ring = bothRings ? -1 : (Math.random() < 0.45 ? INNER : OUTER);

  // Place gate ahead of player (in travel direction)
  const ahead = player.angle + player.dir * (Math.PI * 0.75 + rng(0, Math.PI * 0.4));
  const arcSpan = rng(0.55, 1.1); // radians of danger arc

  const makeGateObj = (r) => ({
    ring: r,
    radius: radii[r],
    centerAngle: ahead,
    arcSpan,
    speed: gateSpeed * (r === INNER ? 1.15 : 1.0),
    dir: (Math.random() < 0.5 ? 1 : -1),
    phase: 'tele',      // tele -> act -> done
    phaseTimer: 0,
    TELE: 2.0,
    ACT: 2.2,
    DONE: 0.5,
    opacity: 0,
    lethal: false,
  });

  if (bothRings) {
    gates.push(makeGateObj(INNER));
    gates.push(makeGateObj(OUTER));
  } else {
    gates.push(makeGateObj(ring));
  }
}

function updateGates(dt) {
  for (let i = gates.length - 1; i >= 0; i--) {
    const g = gates[i];
    g.centerAngle += g.dir * g.speed * dt * timeScale;
    g.phaseTimer += dt * timeScale;

    if (g.phase === 'tele') {
      g.opacity = clamp(g.phaseTimer / g.TELE, 0, 1);
      if (g.phaseTimer >= g.TELE) { g.phase = 'act'; g.phaseTimer = 0; g.lethal = true; }
    } else if (g.phase === 'act') {
      g.opacity = 1;
      if (g.phaseTimer >= g.ACT) { g.phase = 'done'; g.phaseTimer = 0; }
    } else {
      g.opacity = 1 - g.phaseTimer / g.DONE;
      if (g.phaseTimer >= g.DONE) { gates.splice(i, 1); }
    }
  }
}

function drawGates(cx, cy) {
  const radii = ringRadii();
  for (const g of gates) {
    if (g.opacity <= 0) continue;
    const r = g.radius;
    const half = g.arcSpan / 2;
    const startA = g.centerAngle - half;
    const endA = g.centerAngle + half;

    const hueGate = g.ring === INNER ? 0 : 30; // red/orange
    const alpha = g.opacity;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Glow underlay
    ctx.strokeStyle = hsl(hueGate, 100, 60, 0.3);
    ctx.lineWidth = g.lethal ? 14 : 8;
    ctx.shadowBlur = 20;
    ctx.shadowColor = hsl(hueGate, 100, 50);
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA, endA);
    ctx.stroke();

    // Core arc
    ctx.strokeStyle = hsl(hueGate, 100, g.lethal ? 70 : 55);
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA, endA);
    ctx.stroke();

    // Telegraph pulse during tele phase
    if (g.phase === 'tele') {
      const pulse = Math.sin(g.phaseTimer * 8) * 0.5 + 0.5;
      ctx.globalAlpha = alpha * pulse * 0.5;
      ctx.strokeStyle = hsl(hueGate + 30, 100, 80);
      ctx.lineWidth = 2;
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 8, startA, endA);
      ctx.stroke();
    }

    ctx.restore();
  }
}

function checkGateCollision(cx, cy) {
  const radii = ringRadii();
  for (const g of gates) {
    if (!g.lethal) continue;
    if (g.ring !== player.ring) continue;
    // Angular check
    const diff = Math.abs(angleDiff(player.angle, g.centerAngle));
    if (diff < g.arcSpan / 2 + 0.12) {
      return true;
    }
  }
  return false;
}

function checkPerfectFlip() {
  // "Perfect flip" = passed very close to a gate on the OTHER ring just after flipping
  const radii = ringRadii();
  const otherRing = player.ring === INNER ? OUTER : INNER;
  for (const g of gates) {
    if (!g.lethal) continue;
    if (g.ring !== otherRing) continue;
    const diff = Math.abs(angleDiff(player.angle, g.centerAngle));
    if (diff < g.arcSpan / 2 + 0.2 && diff > g.arcSpan / 2 - 0.05) {
      return true;
    }
  }
  return false;
}

// ─── scoring ─────────────────────────────────────────────────────────────────
function getMultiplier() {
  let m = player.ring === INNER ? 2.0 : 1.0;
  if (gameTime > 30) m *= 1.5;
  return m;
}

// ─── input ───────────────────────────────────────────────────────────────────
function onInput(e) {
  if (e.target && e.target.tagName === 'A') return;
  if (state === 'start') {
    state = 'playing';
    return;
  }
  if (state === 'gameover') {
    // Check share button tap
    if (shareBtn) {
      const ex = e.clientX ?? (e.touches && e.touches[0]?.clientX);
      const ey = e.clientY ?? (e.touches && e.touches[0]?.clientY);
      if (ex !== undefined) {
        const rect = canvas.getBoundingClientRect();
        const mx = (ex - rect.left) / rect.width * W;
        const my = (ey - rect.top) / rect.height * H;
        if (mx >= shareBtn.x && mx <= shareBtn.x + shareBtn.w &&
            my >= shareBtn.y && my <= shareBtn.y + shareBtn.h) {
          doShare();
          return;
        }
      }
    }
    state = 'playing';
    initGame();
    return;
  }
  if (state === 'playing') {
    flipRing();
  }
}

function flipRing() {
  const prevRing = player.ring;
  player.ring = player.ring === INNER ? OUTER : INNER;
  const radii = ringRadii();
  player.targetR = radii[player.ring];

  // Check perfect flip
  if (checkPerfectFlip()) {
    perfectStreak++;
    totalPerfect++;
    score += 50 * perfectStreak;
    slowMoTimer = 0.12;
    timeScale = 0.35;
    trauma = Math.min(trauma + 0.2, 0.5);
    const px = W / 2 + Math.cos(player.angle) * player.r;
    const py = H / 2 + Math.sin(player.angle) * player.r;
    spawnParticles(px, py, 28, player.ring === INNER ? 300 : 180, 200, 5, 0.6);
  } else {
    perfectStreak = 0;
  }
}

function doShare() {
  const seed = 'DAILY-' + new Date().toISOString().slice(0, 10);
  const url = location.origin + location.pathname + '?challengeScore=' + score + '&seed=' + seed;
  const text = `I scored ${score} in Orbit Shift! Can you beat me? 🚀`;
  if (navigator.share) {
    navigator.share({ title: 'Orbit Shift', text, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(url + '\n' + text).then(() => {
      // brief visual ack handled in draw
    }).catch(() => {});
  }
}

canvas.addEventListener('pointerdown', onInput);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onInput(e); }
});

// ─── main loop ────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (rawDt <= 0) return;

  if (state === 'playing') {
    update(rawDt);
  }
  render(rawDt);
}
requestAnimationFrame((ts) => { lastTime = ts; requestAnimationFrame(loop); });

// ─── update ───────────────────────────────────────────────────────────────────
function update(rawDt) {
  // slow-mo
  if (slowMoTimer > 0) {
    slowMoTimer -= rawDt;
    if (slowMoTimer <= 0) { slowMoTimer = 0; timeScale = 1; }
  }
  const dt = rawDt * timeScale;

  gameTime += dt;
  bgHue = (bgHue + bgHueSpeed * rawDt) % 360;

  // difficulty ramp
  diffTimer += dt;
  if (diffTimer > 8) {
    diffTimer = 0;
    gateInterval = Math.max(1.4, gateInterval - 0.18);
    gateSpeed = Math.min(2.2, gateSpeed + 0.1);
    player.angularVelocity = Math.min(3.0, player.angularVelocity + 0.06);
  }

  // trauma decay
  trauma = Math.max(0, trauma - rawDt * 1.2);

  // player movement
  player.angle += player.dir * player.angularVelocity * dt;
  player.r = lerp(player.r, player.targetR, 1 - Math.pow(0.01, rawDt * 12));

  // inner time
  if (player.ring === INNER) innerTime += dt;

  // score
  score += getMultiplier() * dt * 8;

  // thruster particles
  player.thrusterTimer -= dt;
  if (player.thrusterTimer <= 0) {
    player.thrusterTimer = 0.04;
    const px = W / 2 + Math.cos(player.angle) * player.r;
    const py = H / 2 + Math.sin(player.angle) * player.r;
    spawnThruster(px, py, player.ring);
  }

  // gate spawning
  if (!player._gateTimer) player._gateTimer = gateInterval * 0.5;
  player._gateTimer -= dt;
  if (player._gateTimer <= 0) {
    player._gateTimer = gateInterval + rng(-0.3, 0.3);
    spawnGate();
  }

  updateGates(dt);
  updateParticles(rawDt);

  // collision
  if (checkGateCollision(W / 2, H / 2)) {
    triggerDeath();
  }
}

function triggerDeath() {
  state = 'gameover';
  trauma = 1;
  if (score > highScore) {
    highScore = Math.floor(score);
    localStorage.setItem(LS_KEY, highScore);
  }
  const px = W / 2 + Math.cos(player.angle) * player.r;
  const py = H / 2 + Math.sin(player.angle) * player.r;
  spawnParticles(px, py, 60, player.ring === INNER ? 300 : 180, 350, 7, 1.0);
  spawnParticles(px, py, 30, 50, 250, 4, 0.7);
}

// ─── render ───────────────────────────────────────────────────────────────────
function render(dt) {
  ctx.save();

  // Screen shake
  const shakeAmt = trauma * trauma * 18;
  const sx = rng(-shakeAmt, shakeAmt);
  const sy = rng(-shakeAmt, shakeAmt);
  ctx.translate(W / 2 + sx, H / 2 + sy);
  const drawX = -W / 2, drawY = -H / 2;

  // Background gradient
  const bg = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 0.7);
  bg.addColorStop(0, hsl(bgHue, 30, 8));
  bg.addColorStop(1, hsl(bgHue + 40, 20, 4));
  ctx.fillStyle = bg;
  ctx.fillRect(drawX, drawY, W, H);

  // Stars
  drawStars(drawX, drawY);

  const cx = 0, cy = 0;
  const radii = ringRadii();

  // Core glow
  const coreG = ctx.createRadialGradient(cx, cy, 0, cx, cy, radii[INNER] * 0.35);
  coreG.addColorStop(0, hsl(bgHue + 60, 80, 80, 0.9));
  coreG.addColorStop(0.5, hsl(bgHue + 30, 60, 40, 0.4));
  coreG.addColorStop(1, 'transparent');
  ctx.fillStyle = coreG;
  ctx.beginPath();
  ctx.arc(cx, cy, radii[INNER] * 0.35, 0, TWO_PI);
  ctx.fill();

  // Rings
  drawRings(cx, cy, radii);

  // Gates
  drawGates(cx, cy);

  // Particles
  ctx.save();
  ctx.translate(drawX + W / 2, drawY + H / 2);
  // Particles are stored in world coords (W/2-centered from canvas)
  ctx.restore();
  drawParticlesWorld(cx, cy);

  // Player ship
  if (state === 'playing' || state === 'gameover') {
    drawShip(cx, cy);
  }

  ctx.restore();

  // UI (no shake)
  ctx.save();
  if (state === 'start') drawStartScreen();
  else if (state === 'playing') drawHUD();
  else if (state === 'gameover') drawGameOver();
  ctx.restore();
}

function drawStars(ox, oy) {
  if (!drawStars._stars) {
    drawStars._stars = [];
    for (let i = 0; i < 80; i++) {
      drawStars._stars.push({ x: rng(-210, 210), y: rng(-375, 375), r: rng(0.5, 1.5), a: rng(0.2, 0.7) });
    }
  }
  ctx.fillStyle = '#fff';
  for (const s of drawStars._stars) {
    ctx.globalAlpha = s.a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TWO_PI);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings(cx, cy, radii) {
  for (let ring = 0; ring < 2; ring++) {
    const r = radii[ring];
    const isInner = ring === INNER;
    const active = state === 'playing' && player.ring === ring;
    const mult = isInner ? getMultiplier() : 1;
    const pulseIntensity = isInner ? Math.sin(Date.now() / 300) * 0.15 + 0.85 : 1;
    const hueRing = isInner ? 300 : 180;
    const alpha = active ? 0.55 : 0.25;

    ctx.save();
    ctx.strokeStyle = hsl(hueRing, 70, 60, alpha * pulseIntensity);
    ctx.lineWidth = active ? 2.5 : 1.5;
    ctx.shadowBlur = active ? 12 : 5;
    ctx.shadowColor = hsl(hueRing, 80, 60);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TWO_PI);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticlesWorld(cx, cy) {
  // Particles stored with W/2, H/2 as origin offset
  ctx.save();
  ctx.translate(-W / 2, -H / 2);
  drawParticles();
  ctx.restore();
}

function drawShip(cx, cy) {
  const px = Math.cos(player.angle) * player.r;
  const py = Math.sin(player.angle) * player.r;
  const angle = player.angle + Math.PI / 2 * player.dir;

  const hueShip = player.ring === INNER ? 300 : 180;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);

  // glow
  ctx.shadowBlur = 20;
  ctx.shadowColor = hsl(hueShip, 100, 70);

  // ship body (triangle)
  ctx.fillStyle = hsl(hueShip, 100, 75);
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(-6, 7);
  ctx.lineTo(0, 4);
  ctx.lineTo(6, 7);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ─── UI screens ───────────────────────────────────────────────────────────────
function drawStartScreen() {
  ctx.save();
  // dim overlay
  ctx.fillStyle = 'rgba(5,5,20,0.72)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  // draw preview rings
  const radii = ringRadii();
  ctx.strokeStyle = hsl(bgHue + 120, 60, 50, 0.3);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, radii[0], 0, TWO_PI); ctx.stroke();
  ctx.strokeStyle = hsl(bgHue + 60, 60, 50, 0.3);
  ctx.beginPath(); ctx.arc(cx, cy, radii[1], 0, TWO_PI); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 38px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = hsl(bgHue + 60, 80, 85);
  ctx.shadowBlur = 20;
  ctx.shadowColor = hsl(bgHue + 60, 100, 60);
  ctx.fillText('ORBIT SHIFT', cx, cy - 80);

  ctx.font = '15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#aac';
  ctx.shadowBlur = 0;
  ctx.fillText('Tap to flip ring · Dodge the gates', cx, cy - 42);

  if (challengeScore > 0) {
    ctx.font = 'bold 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = hsl(50, 100, 70);
    ctx.shadowBlur = 8;
    ctx.shadowColor = hsl(50, 100, 50);
    ctx.fillText(`Challenge: beat ${challengeScore}`, cx, cy - 14);
  }

  if (highScore > 0) {
    ctx.font = '14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#88aacc';
    ctx.shadowBlur = 0;
    ctx.fillText(`Best: ${Math.floor(highScore)}`, cx, cy + 14);
  }

  // tap to start
  const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#fff';
  ctx.fillText('TAP TO START', cx, cy + 60);
  ctx.globalAlpha = 1;

  // ring labels
  ctx.shadowBlur = 0;
  ctx.font = '12px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = hsl(300, 80, 70, 0.8);
  ctx.fillText('Inner × 2 score', cx, cy + radii[0] + 16);
  ctx.fillStyle = hsl(180, 80, 70, 0.8);
  ctx.fillText('Outer ring', cx, cy + radii[1] + 16);

  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // Score
  ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 8;
  ctx.shadowColor = hsl(bgHue, 80, 70);
  ctx.fillText(Math.floor(score), W / 2, 18);

  // best
  ctx.font = '13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#88aacc';
  ctx.shadowBlur = 0;
  ctx.fillText('Best ' + Math.floor(Math.max(score, highScore)), W / 2, 52);

  // multiplier badge
  if (player.ring === INNER) {
    ctx.font = 'bold 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = hsl(300, 100, 75);
    ctx.shadowBlur = 6;
    ctx.shadowColor = hsl(300, 100, 60);
    ctx.fillText('× ' + getMultiplier().toFixed(1), W / 2, 70);
  }

  // perfect streak
  if (perfectStreak > 0) {
    ctx.font = 'bold 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = hsl(50, 100, 75);
    ctx.shadowBlur = 6;
    ctx.shadowColor = hsl(50, 100, 55);
    ctx.fillText('PERFECT ×' + perfectStreak, W / 2, 88);
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,5,20,0.80)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 34px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = hsl(0, 80, 70);
  ctx.shadowBlur = 18;
  ctx.shadowColor = hsl(0, 100, 50);
  ctx.fillText('GAME OVER', cx, cy - 100);

  ctx.shadowBlur = 0;
  ctx.font = 'bold 44px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.floor(score), cx, cy - 44);

  ctx.font = '15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#88aacc';
  const isNew = score >= highScore;
  if (isNew) {
    ctx.fillStyle = hsl(50, 100, 75);
    ctx.shadowBlur = 8;
    ctx.shadowColor = hsl(50, 100, 50);
    ctx.fillText('NEW BEST!', cx, cy - 4);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#88aacc';
  } else {
    ctx.fillText('Best: ' + Math.floor(highScore), cx, cy - 4);
  }

  // stats
  ctx.font = '13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#7799bb';
  ctx.fillText(`Inner time: ${innerTime.toFixed(1)}s  |  Perfects: ${totalPerfect}`, cx, cy + 26);

  // tap to retry
  const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.font = 'bold 17px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#ddeeff';
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#aaccff';
  ctx.fillText('TAP TO RETRY', cx, cy + 64);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Share button
  const bw = 140, bh = 36, bx = cx - bw / 2, by = cy + 92;
  shareBtn = { x: bx, y: by, w: bw, h: bh };

  const sPulse = Math.sin(Date.now() / 700) * 0.15 + 0.85;
  ctx.fillStyle = hsl(bgHue + 80, 60, 28, 0.85);
  ctx.strokeStyle = hsl(bgHue + 80, 80, 65, sPulse);
  ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, bw, bh, 8);
  ctx.fill();
  ctx.stroke();

  ctx.font = 'bold 14px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = hsl(bgHue + 80, 80, 82);
  ctx.fillText('Share / Challenge', cx, by + bh / 2);

  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

// ─── boot ─────────────────────────────────────────────────────────────────────
initGame();
</script>
